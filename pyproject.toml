[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "single-cell-cell-type-annotator"
version = "2.0.0"
description = "CellType-Marker: Reference-Based scRNA-seq Marker Overlap & Annotation Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
single-cell-cell-type-annotator = "celltype_annotator.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/single-cell-cell-type-annotator"
Repository = "https://github.com/abusuraihsakhri/single-cell-cell-type-annotator.git"
