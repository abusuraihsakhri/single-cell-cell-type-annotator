name: Test and validate
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile all modules
        run: python -m compileall -q agents celltype_annotator cli.py enrichment.py
      - name: Run test suite
        run: python -m pytest -q
      - name: CLI smoke tests
        run: |
          single-cell-cell-type-annotator --help
          python cli.py verify-audit
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check browser script syntax
        run: node --check web/annotator.js
      - name: Run browser engine tests
        run: node --test tests/browser.test.js
      - name: Verify static entrypoint
        run: |
          test -s web/index.html
          grep -q 'src="./annotator.js"' web/index.html
